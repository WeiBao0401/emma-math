<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src https:：中转站地址由家长在 App 里填，事先不知道域名。脚本、样式、字体只从自己这里来。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: wss://openspeech.bytedance.com; media-src 'self' blob: data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emma 的数学老师">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Emma 的数学老师</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<!-- base.css：设计 token 和共用控件；math.css：公式；keypad.css：答题小键盘（复习、讲题、确认屏都用，所以全局）；
     后面每个界面一张自己的样式表，类名各带前缀（home- cap- ex- pr- book- onboard- parent- chat- pp-） -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/math.css">
<link rel="stylesheet" href="css/keypad.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/capture.css">
<link rel="stylesheet" href="css/explain.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/onboard.css">
<link rel="stylesheet" href="css/parent.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/paper.css">
<link rel="stylesheet" href="css/bookmap.css">
</head>
<body>
<main id="main">
  <p id="boot" class="boot-msg">正在打开…</p>

  <!-- 每个界面一个 section（nav.js SECTIONS），app.js 只显示当前那一个 -->

  <!-- 首页：ui-home.js 启动时换掉这里的内容。静态的这几行留着：脚本没跑起来时也看得出是哪个 App（run.mjs 查文案） -->
  <section id="view-home" class="view" hidden>
    <div class="screen home">
      <header class="runhead">
        <span class="runhead-title" id="home-date"></span>
        <button type="button" class="text-btn parent-link" data-act="parent">家长</button>
      </header>
      <div class="home-main">
        <h1 class="home-title">Emma 的数学老师</h1>
        <p class="lede home-lede">拍下老师批改过的那一页，我们把错题一道一道弄明白。</p>
        <button type="button" class="btn btn-big snap" data-act="snap">拍错题</button>
      </div>
    </div>
  </section>

  <!-- 下面每个界面的内容都由自己的 ui-*.js 画（nav.js ROUTES） -->
  <!-- 拍错题：屏 1-3 拍照、遮名字、等识别；屏 4 这一页的题；屏 5 我看到的题对吗（ui-capture.js） -->
  <section id="view-capture" class="view" hidden></section>
  <section id="view-page" class="view" hidden></section>
  <section id="view-confirm" class="view" hidden></section>

  <!-- 讲题：屏 6-10 先自己找、提示、讲清楚、一句话、同构题、收进本子（ui-explain.js） -->
  <section id="view-explain" class="view" hidden></section>

  <!-- 复习：到期的卡，原题重做和变式题，一题一屏（ui-practice.js） -->
  <section id="view-practice" class="view" hidden></section>

  <!-- 错题本和一张卡的详情（ui-book.js） -->
  <section id="view-book" class="view" hidden></section>
  <section id="view-card" class="view" hidden></section>

  <!-- 家长区：4 位数字码的门，门后是连接、花费、学习设置、清单、模型、数据、模拟（ui-parent.js） -->
  <section id="view-parent" class="view" hidden></section>

  <!-- 第一次打开：老师和你的约定（ui-onboard.js） -->
  <section id="view-onboard" class="view" hidden></section>

  <!-- 问我：自由问答、老师主动找她聊、讲完错题接着问，打字、说话、拍题（ui-chat.js，v0.3） -->
  <section id="view-chat" class="view" hidden></section>
  <section id="view-bookmap" class="view" hidden></section>

  <!-- 考前错题卷：选范围、补题、A4 卷子（打印、分享）、对答案（ui-paper.js，v0.4） -->
  <section id="view-paper" class="view" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="boot-msg">Emma 的数学老师需要打开 JavaScript。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
